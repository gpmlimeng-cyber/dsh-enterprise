# [INPUT]: 依赖生产 Dockerfile、server Maven Wrapper、console/plugin pnpm 锁、GitHub Actions artifact、GHCR 与 npm Trusted Publishing。
# [OUTPUT]: 并行跑后端测试、console check、镜像构建与插件检查；main 发布 GHCR next，版本标签发布 npm。
# [POS]: DSH Enterprise（dshent）公开制品与质量流水线；server-check/console-check 为独立门禁，不阻塞 images 构建拓扑。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

name: Release test artifacts

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  server-check:
    name: Backend tests and log scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run enterprise + server tests
        working-directory: server
        run: |
          ./mvnw -B -ntp -pl owndsh-modules/owndsh-enterprise,owndsh-server -am test \
            -Dmaven.test.skip=false -DskipTests=false
      - name: Scan surefire reports for secrets
        run: |
          set -e
          inputs=""
          if [ -d server/owndsh-modules/owndsh-enterprise/target/surefire-reports ]; then
            inputs="$inputs server/owndsh-modules/owndsh-enterprise/target/surefire-reports"
          fi
          if [ -d server/owndsh-server/target/surefire-reports ]; then
            inputs="$inputs server/owndsh-server/target/surefire-reports"
          fi
          if [ -n "$inputs" ]; then
            node scripts/scan-sensitive-logs.mjs $inputs
          else
            echo "no surefire-reports; skip log scan"
          fi

  console-check:
    name: Console typecheck build and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install and check console
        run: |
          pnpm --dir console install --frozen-lockfile
          pnpm --dir console run check

  images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: server
            dockerfile: deploy/compose/Dockerfile.server
          - name: console
            dockerfile: deploy/compose/Dockerfile.console
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/owndsh-${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=raw,value=next,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  plugin-check:
    name: Build plugin package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm --prefix plugin/packages/bundle pkg set version="${GITHUB_REF_NAME#v}"
      - name: Install and check plugin
        run: |
          pnpm --dir plugin install --frozen-lockfile
          pnpm --dir plugin run check
      - name: Pack plugin
        run: |
          mkdir -p artifacts
          pnpm --dir plugin --filter owndsh-plugin pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: owndsh-plugin-package
          path: artifacts/*.tgz
          if-no-files-found: error

  plugin-publish:
    name: Publish plugin npm package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: plugin-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: owndsh-plugin-package
          path: plugin-package
      - name: Publish npm package
        run: |
          npm install --global npm@11.11.0
          tag=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then tag=next; fi
          npm publish ./plugin-package/*.tgz --tag "$tag" --provenance --access public
