# [INPUT]: 依赖根协议资源 ID、revision、cursor、requestId 与严格成功 envelope；技能 frontmatter 语义对齐 DSH 官方 `dsh-skill`/`dsh-skill-filesystem` 的 name/description/调用策略解析。
# [OUTPUT]: 提供 dsh-skill v1 技能包（含可选 category 分类）/版本/技能条目/可见范围/标记写入与 runtime 摘要/详情 schema。
#          **本刀（SkillCategory 七类枚举 + manifest 写包规约）**：category 由自由字符串**收敛为七类枚举**
#          （`SkillCategory`：精选/效率/研究/编程/商业/创意/其他），`SkillPackage.category` 与
#          `RuntimeSkillSummary.category` 都改为引用它。**manifest 是分类的唯一真源**（上传时以包内声明为准，
#          见服务端 `SkillCatalogService`），故本刀**不改服务端写入通道**，只把「该写什么值」定死并在规约里写明。
#          ★ 关于 featured（包级布尔标记）：**它今天没有流到员工端**——`featured` 只出现在
#          `SkillMarks` 写体与 `SkillPackage` 管理端投影，`RuntimeSkillSummary` 无此字段、服务端两条 runtime
#          查询也没 select 它、客户端解码层零命中。故「勾 featured 即精选」这条**要等 featured 贯通到
#          runtime 投影后才能用**（需改 5 处：契约字段 → SkillViews 投影 → JdbcSkillStore 两条 SQL →
#          本机 decode → 行模型/分组投影）。**本刀的验收只用 category: 精选 这一条入口**，不依赖 featured。
# [POS]: contracts/components 的企业技能目录真源，不投影 artifact 路径、SKILL.md 正文、包内脚本或签名私钥。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

SkillPackageId:
  type: string
  pattern: '^[1-9][0-9]{0,18}$'
SkillVersionId:
  type: string
  pattern: '^[1-9][0-9]{0,18}$'
SkillAssignmentId:
  type: string
  pattern: '^[1-9][0-9]{0,18}$'
SkillVersionStatus:
  type: string
  enum: [VALIDATED, PUBLISHED, RETIRED]
SkillPackageStatus:
  type: string
  enum: [ACTIVE, DISABLED]
SkillSubjectType:
  type: string
  enum: [ALL, USER]
SkillAssignmentStatus:
  type: string
  enum: [ACTIVE, DISABLED]
# manifest.id 的稳定标识：与 DSH skill 名规约同源（小写连字符），封顶 64，避免与包显示名混淆。
SkillPackageRef:
  type: string
  minLength: 1
  maxLength: 128
  pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
# 单个 SKILL.md 条目名：严格 kebab-case，对齐 dsh-skill 的 isSkillName 正则。
SkillEntryName:
  type: string
  minLength: 1
  maxLength: 64
  pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
SkillSourceDshVersion:
  type: string
  minLength: 1
  maxLength: 64
SkillSha256:
  type: string
  pattern: '^[0-9a-f]{64}$'
# 单条技能元数据（来自 SKILL.md frontmatter 的脱敏投影，绝不含正文）。
SkillEntry:
  type: object
  additionalProperties: false
  required: [name, description, modelInvocable, userInvocable]
  properties:
    name: {$ref: '#/SkillEntryName'}
    description:
      type: string
      minLength: 1
      maxLength: 1024
    whenToUse:
      type: string
      maxLength: 2048
    modelInvocable:
      type: boolean
    userInvocable:
      type: boolean
# 分类七类枚举（用户口径：精选 / 效率 / 研究 / 编程 / 商业 / 创意 / 其他）。
#
# ★ **枚举由「员工端分组」执行，不是由服务端拒收**（用户裁决 A：先只收窄契约，验包层暂不动）。
#   服务端 `SkillArtifactInspector.optionalCategory` 只校验「非字符串 / >32 字符 / 纯空白」，
#   **不校验枚举**，且已入库的活测试 `SkillArtifactInspectorTest.projectsDeclaredCategoryFromManifest`
#   明确断言「办公效率」这类**枚举外**旧值必须被原样透传。已知该测试与本枚举直接矛盾，
#   本刀按裁决保留服务端现状 ⇒ 口径是：
#     · 写包人写枚举外的值（如存量旧包）⇒ **照常上传成功**，契约在读侧不承诺它合法；
#     · 员工端 `enterpriseMarketCategory()` 把**枚举外的一切**（含旧值）**静默归「其他」**；
#     · 线上是否真有枚举外脏值，待查库（SELECT category, count(*) FROM ent_skill_package
#       WHERE category IS NOT NULL AND category NOT IN ('精选','效率','研究','编程','商业','创意','其他')
#       GROUP BY category）——0 行则无需清洗，N 行则更干净的做法是**重新上传**（直接改库会留下 revision 漂移）。
#   待验包层也收紧时，同步改上面那条活测试（它是唯一挡路的门禁）。
# · 「精选」当前**唯一**入口是 `category: 精选`（包级 `featured` 标记尚未贯通到员工端，见文件头 ★）。
# · 「其他」是**兜底格**：manifest 省略 category、或给了枚举外的旧值时，员工端按裁决 A 归到「其他」；
#   枚举外的值在**写入侧被拒绝**（见 SkillPackage.category 的说明），避免脏值进库。
# · 枚举值是中文展示词，直接进 manifest 与数据库；≤32 的上限由 SkillCategory.maxLength 承担。
SkillCategory:
  type: string
  enum: [精选, 效率, 研究, 编程, 商业, 创意, 其他]
  maxLength: 32
  description: 技能分类七类；「精选」当前唯一入口是本枚举自身的 精选 值（包级 featured 标记尚未贯通到员工端）；未声明或旧脏值由员工端兜底归「其他」。

SkillUploadMetadata:
  type: object
  additionalProperties: false
  properties:
    displayName:
      type: string
      minLength: 1
      maxLength: 120
    description:
      type: string
      maxLength: 2000
SkillVersion:
  type: object
  additionalProperties: false
  required:
    - id
    - packageId
    - skillId
    - sourceDshVersion
    - sizeBytes
    - sha256
    - status
    - skillCount
    - createdAt
    - revision
  properties:
    id: {$ref: '#/SkillVersionId'}
    packageId: {$ref: '#/SkillPackageId'}
    skillId: {$ref: '#/SkillPackageRef'}
    sourceDshVersion: {$ref: '#/SkillSourceDshVersion'}
    sizeBytes:
      type: integer
      format: int64
      minimum: 1
      maximum: 52428800
    sha256: {$ref: '#/SkillSha256'}
    status: {$ref: '#/SkillVersionStatus'}
    skillCount:
      type: integer
      minimum: 1
      maximum: 200
    skills:
      type: array
      maxItems: 200
      items: {$ref: '#/SkillEntry'}
    createdAt:
      type: string
      format: date-time
    revision:
      $ref: '../enterprise-openapi.yaml#/components/schemas/Revision'
SkillVersionResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data: {$ref: '#/SkillVersion'}
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
SkillAssignment:
  type: object
  additionalProperties: false
  required: [id, packageId, subjectType, status, revision]
  properties:
    id: {$ref: '#/SkillAssignmentId'}
    packageId: {$ref: '#/SkillPackageId'}
    subjectType: {$ref: '#/SkillSubjectType'}
    subjectId:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
    status: {$ref: '#/SkillAssignmentStatus'}
    revision:
      $ref: '../enterprise-openapi.yaml#/components/schemas/Revision'
SkillAssignmentSpec:
  type: object
  additionalProperties: false
  required: [subjectType]
  properties:
    subjectType: {$ref: '#/SkillSubjectType'}
    subjectId:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
SkillAssignmentBatchRequest:
  type: object
  additionalProperties: false
  required: [assignments]
  properties:
    assignments:
      type: array
      minItems: 0
      maxItems: 200
      items: {$ref: '#/SkillAssignmentSpec'}
# 标记写入体：两个字段都必须显式给出，缺席由服务端拒绝，避免"漏传即 false"。
SkillMarksRequest:
  type: object
  additionalProperties: false
  required: [builtin, featured]
  properties:
    builtin:
      type: boolean
    featured:
      type: boolean
SkillPackage:
  type: object
  additionalProperties: false
  required: [id, skillId, displayName, builtin, featured, status, revision, versions, assignments]
  properties:
    builtin:
      type: boolean
    featured:
      type: boolean
    id: {$ref: '#/SkillPackageId'}
    skillId: {$ref: '#/SkillPackageRef'}
    displayName:
      type: string
      minLength: 1
      maxLength: 120
    description:
      type: string
      maxLength: 2000
    # 可选分类：缺席或 null 表示没有分类；非空则必须是 SkillCategory 七类之一
    # （纯空白与枚举外旧值在验包层被拒绝，员工端只兜底读侧）。
    category:
      oneOf:
        - $ref: '#/SkillCategory'
        - type: 'null'
    status: {$ref: '#/SkillPackageStatus'}
    revision:
      $ref: '../enterprise-openapi.yaml#/components/schemas/Revision'
    versions:
      type: array
      items: {$ref: '#/SkillVersion'}
    assignments:
      type: array
      items: {$ref: '#/SkillAssignment'}
SkillPackagePageData:
  type: object
  additionalProperties: false
  required: [items, page]
  properties:
    items:
      type: array
      maxItems: 200
      items: {$ref: '#/SkillPackage'}
    page:
      $ref: '../enterprise-openapi.yaml#/components/schemas/CursorPage'
SkillPackageListResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data: {$ref: '#/SkillPackagePageData'}
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
# 标记写入的响应复用列表投影：单个 SkillPackage 包在统一成功 envelope 里。
SkillPackageResponse:
  type: object
  additionalProperties: false
  required: [data, requestId]
  properties:
    data: {$ref: '#/SkillPackage'}
    requestId:
      $ref: '../enterprise-openapi.yaml#/components/schemas/RequestId'
RuntimeSkillSummary:
  type: object
  additionalProperties: false
  required: [id, skillId, displayName, description, sourceDshVersion, sizeBytes, skillCount, updatedAt]
  properties:
    id: {$ref: '#/SkillPackageId'}
    skillId: {$ref: '#/SkillPackageRef'}
    displayName:
      type: string
      minLength: 1
      maxLength: 120
    description:
      type: string
      maxLength: 2000
    # 员工端可选分类：缺席或 null 表示没有分类；非空恒为 SkillCategory 七类之一
    # （写入侧已拒枚举外值，读侧由服务端保证形状；前端在缺席/null 时不渲染分类标签）。
    category:
      oneOf:
        - $ref: '#/SkillCategory'
        - type: 'null'
    sourceDshVersion: {$ref: '#/SkillSourceDshVersion'}
    sizeBytes:
      type: integer
      format: int64
      minimum: 1
      maximum: 52428800
    skillCount:
      type: integer
      minimum: 1
      maximum: 200
    updatedAt:
      type: string
      format: date-time
# 详情 = 摘要 + 版本事实：category 由 RuntimeSkillSummary 分支一并继承，这里不重复声明。
RuntimeSkillDetail:
  allOf:
    - $ref: '#/RuntimeSkillSummary'
    - type: object
      additionalProperties: false
      required: [versionId, sha256, skills]
      properties:
        versionId: {$ref: '#/SkillVersionId'}
        sha256: {$ref: '#/SkillSha256'}
        skills:
          type: array
          maxItems: 200
          items: {$ref: '#/SkillEntry'}
