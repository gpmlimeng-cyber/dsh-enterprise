# OwnDsh 帮助中心 · 站点地图真源
#
# 作用：build-help.mjs 的唯一导航与内容清单来源。左侧导航树、首页卡片、
#      搜索索引、上/下一篇、"待撰写"统计全部由此文件驱动。
#
# 约定：
#   id          稳定标识（锚点、搜索索引 key、跨页引用都用它）
#   file        相对 /opt/owndsh/help 的 Markdown 路径
#   audience    admin | user | ops | all
#   order       同 section 内排序（左侧树与上/下一篇顺序）
#   sources     素材真源（写作用参考；同时作为 --check 的人工可追溯线索）
#   generated   true = 由构建期生成（禁止手改），叙述部分仍来自 file
#   status      draft（未校验）| verified（已人工校验）
#
# 规模：4 个 section + 首页 = 38 篇

version: 1

site:
  title: OwnDsh 帮助中心
  basePath: /help/
  productVersion: 0.1.0
  sharedAssets: /opt/owndsh/docs-assets     # theme.css + fonts/，与 API 文档门户共用同一份源
  homepage: /home/                          # 产品官网
  apiReference: /api-docs/                  # 交叉链接目标
  console: /
  verifyMaxAgeDays: 90                      # verifiedAt 超过此天数在页头标记"待复核"

home:
  file: content/index.md
  title: 帮助中心
  summary: 按角色选择入口：管理员配置与治理、员工接入与使用、运维部署与恢复。

sections:
  # ─────────────────────────────────────────────────────────────
  - id: admin
    title: 管理员手册
    audience: admin
    path: /help/admin/
    summary: 从零把企业配置到可用：身份、成员、模型、授权、配额、插件、审计。
    pages:
      - id: admin-quickstart
        title: 快速开始：30 分钟让企业可用
        file: content/admin/quickstart.md
        order: 1
        summary: 部署后的六步配置路线，从身份源到员工接入。
        sources: [README.md, DEPLOYMENT.md, docs/v1-product-feature-catalog.md]
        status: draft
      - id: admin-console-tour
        title: 控制台导览：五个入口各管什么
        file: content/admin/console-tour.md
        order: 2
        summary: 模型 / 访问策略 / 插件 / 成员 / 活动记录 的职责边界与使用顺序。
        sources: [docs/phase-2-product-console-design.md, console/src/app/product-routes.ts]
        status: draft
      - id: admin-local-account
        title: 本地账号、验证码与首次强制改密
        file: content/admin/local-account.md
        order: 3
        summary: 口令策略、验证码、首次登录强制改密与改密失败的处理。
        sources: [console/src/routes/login.tsx, server/owndsh-modules/owndsh-enterprise/src/main/java/com/owndsh/enterprise/auth/web/PlatformAuthController.java]
        uiLabels: [登录, 验证码, 新密码]
        status: draft
      - id: admin-identity-sources
        title: 接入企业身份源（LOCAL / LDAP / OIDC）
        file: content/admin/identity-sources.md
        order: 4
        summary: 新建身份源、连通性测试、启停与字段含义。
        sources: [contracts/components/identity.yaml, docs/v1-product-feature-catalog.md]
        uiLabels: [身份接入, 新建身份源, 测试]
        status: draft
      - id: admin-members
        title: 成员治理：状态、固定角色、身份链接
        file: content/admin/members.md
        order: 5
        summary: 邀请成员、启停、角色替换、外部身份绑定与解绑的约束。
        sources: [docs/v1-product-feature-catalog.md, server/owndsh-modules/owndsh-enterprise/src/main/java/com/owndsh/enterprise/auth/web/AdminMemberController.java]
