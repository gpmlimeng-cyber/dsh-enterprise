<!--
[INPUT]: 依赖 config/site.yaml 的 site 段与构建期 {{base}} 替换。
[OUTPUT]: 全站顶栏：产品导航、文档入口、GitHub、主题切换（共用 'bui-theme' 键）与主 CTA。
[POS]: partials 的导航片段；由 build.mjs 注入每个页面头部的 inject:nav 占位（占位写法在此不写完整注释标记，避免嵌套闭合）。
[PROTOCOL]: 变更时更新此头部，然后检查 设计方案.md §4
-->
<header class="topbar">
  <a class="brand" href="{{base}}">
    <img src="{{base}}assets/brand/whale-animated.png" alt="" width="24" height="24" />
    <span>DSH Enterprise</span>
  </a>

  <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="展开导航">
    <span></span><span></span>
  </button>

  <nav id="site-nav" class="nav" aria-label="主导航">
    <a href="{{base}}">产品</a>
    <a href="{{base}}enterprise/">企业版</a>
    <a href="{{base}}deploy/">部署</a>
    <a href="{{base}}download/">下载</a>
    <a href="{{base}}security/">安全</a>
    <a href="/help/">文档</a>
  </nav>

  <div class="topbar-actions">
    <div class="theme-toggle" hidden role="group" aria-label="主题">
      <span class="theme-toggle-indicator" aria-hidden="true"></span>
      <button type="button" data-theme-value="light" aria-label="浅色主题" aria-pressed="false">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="currentColor" stroke="none" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
      <button type="button" data-theme-value="dark" aria-label="深色主题" aria-pressed="false">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
    </div>
    <a class="btn btn-ghost" href="https://github.com/boe1900/owndsh" target="_blank" rel="noopener">GitHub</a>
    <a class="btn btn-primary" href="{{base}}deploy/">开始部署</a>
  </div>
</header>
