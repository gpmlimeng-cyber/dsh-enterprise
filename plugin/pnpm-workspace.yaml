packages:
  - packages/*

# [本机工具链 pin] 仓库声明 packageManager: pnpm@11.7.0，而 dsh-mobile 快照预装的是 pnpm 10.12.1。
# 每次启动 pnpm 都会触发自升级（managePackageManagerVersions 默认 true），把 11.7.0 装到
# .tools/pnpm/11.7.0_tmp_* 时被本机 linker64 当 ELF 执行失败，留下坏状态导致所有 pnpm 命令崩。
# 关掉自升级、用预装的 10.12.1 跑（与 preview-p0 当时的持久开关一致）。仅影响工具链选择，不动依赖语义。
managePackageManagerVersions: false

# Bundle compilation needs esbuild's reviewed native binary. Every other
# dependency lifecycle script remains denied by pnpm 11.
allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-brand@0.1.5-rc.2'
  - '@deepseek-ai/dsh-client-ui-primitives@0.1.5-rc.2'
  - '@deepseek-ai/dsh-credentials@0.1.5-rc.2'
  - '@deepseek-ai/dsh-fs@0.1.5-rc.2'
  - '@deepseek-ai/dsh-host-plugin-inventory@0.1.5-rc.2'
  - '@deepseek-ai/dsh-http-proxy@0.1.5-rc.2'
  - '@deepseek-ai/dsh-llm-pi-ai@0.1.5-rc.2'
  - '@deepseek-ai/dsh-llm@0.1.5-rc.2'
  - '@deepseek-ai/dsh-sandbox@0.1.5-rc.2'
  - '@deepseek-ai/dsh-settings@0.1.5-rc.2'
  - '@deepseek-ai/dsh-subprocess@0.1.5-rc.2'
  - '@deepseek-ai/dsh-timeout@0.1.5-rc.2'
  - '@deepseek-ai/dsh-typert-protocol@0.1.5-rc.2'
  - '@deepseek-ai/dsh-util-crypto@0.1.5-rc.2'
  - '@deepseek-ai/dsh-util-values@0.1.5-rc.2'
