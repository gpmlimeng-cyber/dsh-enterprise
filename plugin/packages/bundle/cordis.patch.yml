# [INPUT]: 依赖官方 dsh.bundle patch 覆盖、裸包名 Loader 与 base/web 既有 row id；依赖 owner entry `owndsh` 的 volatile 字段（`serverUrl`/`platformOrigin`/`inferenceOrigin`）里的用户地址
# [OUTPUT]: 覆盖企业默认模型、停用 base provider/个人模型设置与官方账户行，插入 owndsh Host/Client row
# [POS]: bundle 的企业 profile 策略层；官方账户实现改由企业 bundle 用用户自定义地址挂载，企业模型路由并入 profile 已挂载的官方 llm-pi-ai（不再自建第二份实例）
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash

- id: deepseek-account
  disabled: true

# 官方账户 UI 整体退场：官方账户/登录入口不挂载；个人中心入口改由我们占用官方
# `settings.launcher` 座位——该座位就是官方给"账户自有侧栏菜单"留的位置，座位被占用后
# SettingsRoot 的 fallback 设置齿轮不再渲染，因此"设置"由我们的菜单提供。
# 官方没有"只隐藏登录动作"的受支持开关，故这里是整行停用（它同时关掉官方首启引导）。
- id: ui-settings-account
  disabled: true

- insert:
    - id: owndsh
      name: 'dshent-plugin'
