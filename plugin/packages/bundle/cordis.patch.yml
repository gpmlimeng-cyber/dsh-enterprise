# [INPUT]: 依赖官方 dsh.bundle patch 覆盖、裸包名 Loader 与 base/web 既有 row id
# [OUTPUT]: 覆盖企业默认模型并插入 owndsh Host/Client row；保留官方 llm-deepseek/llm-pi-ai/ui-settings-models（官方自定义模型配置）
# [POS]: bundle 的企业 profile 策略层；官方 llm-pi-ai 由企业 row 在隔离 settings scope 中挂载
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
- id: agent-default-model
  config:
    provider: enterprise
    model: enterprise/default

- insert:
    - id: owndsh
      name: 'dshent-plugin'
