# [INPUT]: 依赖官方 dsh.bundle patch 覆盖、裸包名 Loader 与 base/web 既有 row id；依赖官方 settings 中 `owndsh-account` 的用户地址
# [OUTPUT]: 覆盖企业默认模型、停用 base provider/个人模型设置与官方账户行，插入 owndsh Host/Client row
# [POS]: bundle 的企业 profile 策略层；官方账户实现改由企业 bundle 用用户自定义地址挂载，官方 llm-pi-ai 由企业 row 在隔离 settings scope 中挂载
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash

# 推理走官方适配器（协议实现归官方，企业只改端点）：端点默认企业后台，可自定义。
- id: llm-deepseek
  config:
    baseURL: !!js "process.env.DSHENT_INFERENCE_ORIGIN ?? 'https://meizhiyun.chat'"



# ── 目标1：官方账户管理与页面复用，后台地址由用户在官方 settings 里自己填 ────────
#
# 官方 `deepseek-account` 行（`@deepseek-ai/dsh-deepseek-account-platform`）默认指向
# `https://platform.deepseek.com` 与 `https://api.deepseek.com`。企业版把这一行**停用**，
# 由企业 bundle 用**官方同一实现**、按 `owndsh-account` settings 段里的地址重新挂载：
# 地址变更即热重挂（dispose 旧实例 + 用新配置挂载），无需重启 Harness。
#
# 三条约束：
# 1. 本行只写 `disabled: true`，不再覆盖 `config`：patch 的 `config` 是**整体替换**而非深合并，
#    而 base 行里的 `desktopPlatform` 表达式在企业挂载点里逐字重述，桌面原生身份不会丢。
# 2. 官方 `platformOrigin()` 只接受 HTTPS，或显式开启的 loopback HTTP。企业校验器与它同规则：
#    `https:` 放行，`http:` 仅放行 localhost/127.0.0.1/[::1]，且不得带 userinfo/path/query/hash。
# 3. `inferenceOrigin` 决定账户 token 允许附着到哪个推理/文件后台；两个地址默认同源
#    （`https://meizhiyun.chat`），不同源时账户凭据不会随推理请求发出。
#
# 自定义方式（产品界面内改，写入官方 settings；不设即用上面的企业默认值）：
#   owndsh-account.platformOrigin     账户授权与账户查询后台，默认 https://meizhiyun.chat
#   owndsh-account.inferenceOrigin    账户 token 允许附着的推理/文件后台，默认 https://meizhiyun.chat
- id: deepseek-account
  disabled: true

# 决策3：官方账号区降级为仅信息展示。step: done 关闭官方首启引导（
# onboarding-state visible = !done && signedIn），否则它会盖在我们的登录门禁之上。
# 官方登录入口退场：官方账户/登录入口整体不挂载，左下角位置由我们 bundle 的
# sidebar.footer.action 入口替代（官方没有"只隐藏登录动作"的受支持开关，故整行退场）。
- id: ui-settings-account
  disabled: true

- insert:
    - id: owndsh
      name: 'dshent-plugin'
