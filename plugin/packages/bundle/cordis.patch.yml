# [INPUT]: 依赖官方 dsh.bundle patch 覆盖、裸包名 Loader 与 base/web 既有 row id；依赖 owner entry `dshent` 的 volatile 字段（`serverUrl`/`platformOrigin`/`inferenceOrigin`）里的用户地址
# [OUTPUT]: 覆盖企业默认模型、停用 base provider/个人模型设置与官方账户行，插入 dshent Host/Client row
# [POS]: bundle 的企业 profile 策略层；官方账户实现改由企业 bundle 用用户自定义地址挂载，企业模型路由并入 profile 已挂载的官方 llm-pi-ai（不再自建第二份实例）
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
# [改名] owner entry / 行 id 从 `owndsh` 改为 `dshent`。升级前 profile patch 里旧 `- id: owndsh` 的
# 配置（实机存着 serverUrl 等 volatile 地址）由 apply() 末尾的 migrateLegacyEntrySettings() 读取并
# 搬进新命名空间 `dshent`，避免升级丢 Server 地址（settings 命名空间随 owner entry id 走）。
# [组件拆分] apply() 已拆成 core + 三个可独立开关的块（mountSession/mountLibrary/mountPlugins）。
# 真开关走**本行 config**（不是拆成多行 insert）：块②③④ 全部闭包引用 core 构造的 `platform`，
# 拆成独立 entry 会切断这个共享、直接破坏运行；官方也没有"一个 entry 的多个子面"开关语法
# （只有行级 `disabled`）。故 core 不可关、在此行 config 里声明两个默认开的真开关：
#   libraryEnabled: 资料库块（mountLibrary）；pluginsEnabled: 受管插件块（mountPlugins）。
# 想关掉某块，把对应值改成 false 即可（块不挂 ⇒ 面全撤 / 端口 fail-closed）。
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash

- id: deepseek-account
  disabled: true

# 官方账户 UI 整体退场：官方账户/登录入口不挂载；个人中心入口改由我们占用官方
# `settings.launcher` 座位——该座位就是官方给"账户自有侧栏菜单"留的位置，座位被占用后
# SettingsRoot 的 fallback 设置齿轮不再渲染，因此"设置"由我们的菜单提供。
# 官方没有"只隐藏登录动作"的受支持开关，故这里是整行停用（它同时关掉官方首启引导）。
- id: ui-settings-account
  disabled: true

- insert:
    - id: dshent
      name: 'dshent-plugin'
      config:
        # [组件拆分·两个真开关的落点] 默认全开（与拆分前行为逐字一致）；改 false 即关该块。
        libraryEnabled: true
        pluginsEnabled: true
